<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="/js/index.js"></script>
    <link rel="stylesheet" href="/css/index.css">
    <title>Gaming HP</title>
</head>
<body>
    <div class="page-layout">
        <aside class="ad-rail" aria-label="Advertisement">
            <div id="frame-left" class="ad-frame">
                <iframe title="Advertisement" data-aa="2457330" src="//acceptable.a-ads.com/2457330/?size=Adaptive"></iframe>
            </div>
        </aside>

        <main class="site-main">
            <header class="topbar">
                <div class="brand" aria-label="Poki home">
                    <span class="brand-mark">P</span>
                    <span class="brand-name">Poki</span>
                </div>
                <nav class="topnav" aria-label="Main navigation">
                    <a href="#popular">Popular</a>
                    <a href="#new">New</a>
                    <a href="#multiplayer">Multiplayer</a>
                </nav>
                <button class="cta-button" type="button">Play now</button>
            </header>

            <section class="hero" aria-labelledby="games-heading">
                <div class="hero-copy">
                    <p class="eyebrow">Play free online</p>
                    <h1 id="games-heading">The best browser games for quick wins and long sessions.</h1>
                    <p class="hero-text">Jump into speed runs, racing challenges, and survival tests built for instant play.</p>
                </div>
                <div class="hero-panel" aria-label="Featured games summary">
                    <span class="panel-label">Trending</span>
                    <ul>
                        <li><span>Run</span> Subway Surfers</li>
                        <li><span>Build</span> Minecraft</li>
                        <li><span>Race</span> PolyTrack</li>
                    </ul>
                </div>
            </section>

            <section class="games" aria-label="Game catalog">
                <button class="game-button" onclick="NavigateToPage('/pages/minecraft.html')" aria-label="Open Minecraft"><img src="/img/minecraft.jpg" alt="Minecraft game scene with block-built terrain and structures in a colorful, adventurous setting" fetchpriority="high" decoding="async"></button>
                <button class="game-button" onclick="NavigateToPage('/pages/survival_race.html')" aria-label="Open Survival Race"><img src="/img/survival_race.jpg" alt="Survival racing game scene with vehicles competing on a challenging track in an energetic setting" loading="lazy" decoding="async"></button>
                <button class="game-button" onclick="NavigateToPage('/pages/polytrack.html')" aria-label="Open PolyTrack"><img src="/img/polytrack.jpg" alt="Polytrack racing game scene featuring a vehicle on a winding track in a bright, fast-paced setting" loading="lazy" decoding="async"></button>
                <button class="game-button" onclick="NavigateToPage('/pages/geometry_dash.html')" aria-label="Open Geometry Dash"><img src="/img/geometry_dash.jpg" alt="Geometry Dash game scene with a geometric player character navigating a hazardous obstacle course in a vivid, energetic setting" loading="lazy" decoding="async"></button>
                <button class="game-button" onclick="NavigateToPage('/pages/subwaysurf.html')" aria-label="Open Subway Surfers"><img src="/img/subwaysurfers.jpg" alt="Subway Surfers game scene with a runner moving through a colorful subway environment in an exciting, fast-paced setting" loading="lazy" decoding="async"></button>
                <button class="game-button" onclick="NavigateToPage('/pages/drivemad.html')" aria-label="Open Drive Mad"><img src="/img/drivemad.jpg" alt="Drive Mad game scene with a vehicle racing through a city environment in a fast-paced, exciting setting" loading="lazy" decoding="async"></button>
                <button class="game-button" onclick="NavigateToPage('/pages/escaperoad.html')" aria-label="Open Escape Road"><img src="/img/escape.jpeg" alt="escape road game scene with a vehicle navigating through a challenging environment in a dynamic, engaging setting" loading="lazy" decoding="async"></button>
                <button class="game-button" onclick="NavigateToPage('/pages/Five-Nights-at-Epstein/index.html')" aria-label="Open Five Nights at Epstein"><img src="img/fnaf.jpeg" alt="Five Nights at Epstein game scene with a player character in a colorful, interactive environment" loading="lazy" decoding="async"></button>
            </section>
        </main>

        <aside class="ad-rail" aria-label="Advertisement">
            <div id="frame-right" class="ad-frame">
                <iframe title="Advertisement" data-aa="2457330" src="//acceptable.a-ads.com/2457330/?size=Adaptive"></iframe>
            </div>
        </aside>
    </div>
</body>
</html>
