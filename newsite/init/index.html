<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#111827">
    <title>We've moved | Gaming HP</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            place-items: center;
            background: #111827;
            color: #f9fafb;
            font-family: system-ui, sans-serif;
            text-align: center;
        }
        main { max-width: 36rem; }
        .mark { font-size: 3rem; }
        h1 { margin: 0.5rem 0; font-size: clamp(2rem, 8vw, 3.5rem); }
        p { color: #cbd5e1; line-height: 1.7; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">🎮</div>
        <h1>We've moved!</h1>
        <p>Gaming HP has a new home (https://gaminghp.appwrite.network/). Please use our new website address to find your favorite games and more.</p>
    </main>
</body>
</html>
